[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  GAS_URL = "https://script.google.com/macros/s/AKfycbw4mlXDTCjKpEuGt2pSFirr6N05kcca1l6PeWeP_5oNFN60RqD9flyRanCYvKBTsGo1"
# NOTE: The live GAS_URL for the Netlify function is set via the Netlify UI environment variable.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
