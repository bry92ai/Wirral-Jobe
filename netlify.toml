[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# NOTE: Set GAS_URL and all production API keys through Netlify environment variables.
#       Update GAS_URL after creating a new Apps Script deployment.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/directions"
  to = "/.netlify/functions/directions"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
