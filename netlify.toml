[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  GAS_URL = "https://script.google.com/macros/s/AKfycbw2N78ynEwuTcjh9zLfmoywJjJkB4mg6Np1s7toZBu06gyQEqun6TC2BPZXtenZznvy"
# NOTE: The live GAS_URL for the Netlify function is set via the Netlify UI environment variable.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
