[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  GAS_URL = "https://script.google.com/macros/s/AKfycbxlBtOwnSlOTEiQvhvi_0b3lcKNCpCDD1nUxUYZwhahF16tBKUBNCkeX9yzh7Is5_WK"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
