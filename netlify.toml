[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  GAS_URL = "https://script.google.com/macros/s/AKfycbyKyWsk-4_f3tA1yu9k6KDEEJdaHbYV4yekDPAwXhed9_K6e2VEMV4P3ZZULWtKnzya/exec"
# NOTE: The live GAS_URL for the Netlify function is set via the Netlify UI environment variable.
#       Update it there as well after creating a new Apps Script deployment.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/directions"
  to = "/.netlify/functions/directions"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
