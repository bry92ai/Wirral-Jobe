[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  GAS_URL = "https://script.google.com/macros/s/AKfycbxvLNKWnAN-c3lzUcm4r7quHEPJc-PlTWZsldcG_QBSq9Doqowoq_wZ0NO9UtYkECbH"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
