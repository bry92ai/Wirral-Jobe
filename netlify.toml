[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  GAS_URL = "https://script.google.com/macros/s/AKfycbyUBA9zDFkyKPQYYKtGjRgb_2YuYwvtkMDUDNZ1rpOvLDPfR108ncmO8_3QRG6y-yvc"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
